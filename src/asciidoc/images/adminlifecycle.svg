<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%">
    <defs>
        <!-- Pfeilspitze normal -->
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
        </marker>
        <!-- Pfeilspitze Akzent/Reset -->
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
        </marker>
        <!-- Pfeilspitze Rückführung -->
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
        </marker>
        <!-- Schatteneffekt -->
        <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
            <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
        </filter>
    </defs>

    <style>
        .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
        .code-text { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12.5px; fill: #0f172a; font-weight: 500; }
        .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
        .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        .line-bus { stroke: #64748b; stroke-width: 2; fill: none; }
        .loop-line { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; fill: none; marker-end: url(#arrow-blue); }
        .card { filter: url(#shadow); rx: 8px; }
    </style>

    <!-- Hintergrund -->
    <rect width="1020" height="620" fill="#f8fafc" rx="12"/>

    <!-- ================= PHASE 1: ERSTSTART ================= -->

    <!-- Start-Badge -->
    <g transform="translate(40, 30)">
        <rect class="card" width="130" height="36" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="18"/>
        <text class="node-text" x="65" y="23" text-anchor="middle" fill="#1d4ed8">⚡ [ Erststart ]</text>
    </g>

    <!-- Pfeil nach unten -->
    <path class="line" d="M 105 66 L 105 110" />

    <!-- Schritt 1: /wyarf Endpoint -->
    <g transform="translate(40, 110)">
        <rect class="card" width="190" height="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text class="code-text" x="95" y="29" text-anchor="middle">/wyarf/{user}/{pw}</text>
    </g>

    <path class="line" d="M 230 134 L 270 134" />

    <!-- Schritt 2: Verschlüsselung -->
    <g transform="translate(270, 110)">
        <rect class="card" width="180" height="48" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
        <text class="node-text" x="90" y="29" text-anchor="middle" fill="#7e22ce">🔒 Verschlüsselt Daten</text>
    </g>

    <path class="line" d="M 450 134 L 490 134" />

    <!-- Schritt 3: wyarf.irs -->
    <g transform="translate(490, 110)">
        <rect class="card" width="170" height="48" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
        <text class="node-text" x="85" y="22" text-anchor="middle" fill="#854d0e">📄 Erzeugt Datei</text>
        <text class="code-text" x="85" y="38" text-anchor="middle" fill="#a16207">'wyarf.irs'</text>
    </g>

    <path class="line" d="M 660 134 L 700 134" />

    <!-- Schritt 4: Exit -->
    <g transform="translate(700, 110)">
        <rect class="card" width="180" height="48" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
        <text class="node-text" x="90" y="29" text-anchor="middle" fill="#be123c">🛑 System beendet sich</text>
    </g>

    <!-- Verbindungslinie Phase 1 -> Phase 2 (Große Schleife) -->
    <path class="line" d="M 790 158 L 790 185 L 120 185 L 120 220" />
    <rect x="390" y="174" width="140" height="22" rx="4" fill="#e2e8f0"/>
    <text class="sub-text" x="460" y="189" text-anchor="middle" font-weight="bold">Dienst-Neustart</text>

    <!-- ================= PHASE 2: LAUFZEIT ================= -->

    <!-- Neustart-Badge -->
    <g transform="translate(40, 220)">
        <rect class="card" width="170" height="48" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text class="node-text" x="85" y="29" text-anchor="middle" fill="#15803d">🔄 [ Neustart der App ]</text>
    </g>

    <path class="line" d="M 210 244 L 260 244" />

    <!-- SecurityConfig -->
    <g transform="translate(260, 220)">
        <rect class="card" width="280" height="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text class="node-text" x="140" y="22" text-anchor="middle">SecurityConfig</text>
        <text class="sub-text" x="140" y="38" text-anchor="middle">entschlüsselt 'wyarf.irs' via MasterKey</text>
    </g>

    <path class="line" d="M 540 244 L 590 244" />

    <!-- Admin aktiv im RAM -->
    <g transform="translate(590, 220)">
        <rect class="card" width="190" height="48" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
        <text class="node-text" x="95" y="29" text-anchor="middle" fill="#0e7490">🧠 Admin aktiv im RAM</text>
    </g>

    <!-- ================= PHASE 3: AKTIONEN (BUS-TREE) ================= -->

    <!-- Verteilerlinie nach unten -->
    <path class="line-bus" d="M 120 268 L 120 464" />

    <!-- Zweig 1: Login Web-UI -->
    <path class="line" d="M 120 320 L 170 320" />
    <g transform="translate(170, 298)">
        <rect class="card" width="240" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text class="code-text" x="15" y="27">Login über Web-UI (/master)</text>
    </g>
    <path class="line" d="M 410 320 L 450 320" />
    <g transform="translate(450, 298)">
        <rect class="card" width="330" height="44" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text class="node-text" x="95" y="27" text-anchor="start" fill="#334155">Zugriff auf <tspan class="code-text">/admin/**</tspan></text>
    </g>

    <!-- Zweig 2: wyarfList -->
    <path class="line" d="M 120 390 L 170 390" />
    <g transform="translate(170, 368)">
        <rect class="card" width="470" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text class="node-text" x="20" y="27">Abfrage aller Admins über <tspan class="code-text" fill="#2563eb">/wyarfList/{user}/{pw}</tspan></text>
    </g>

    <!-- Zweig 3: wyarfdelete -->
    <path class="line" d="M 120 464 L 170 464" />
    <g transform="translate(170, 442)">
        <rect class="card" width="490" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text class="node-text" x="20" y="27">Löschen von Admins über <tspan class="code-text" fill="#dc2626">/wyarfdelete/{user}/{pw}/{target}</tspan></text>
    </g>

    <!-- Unterer Zweig aus Löschen (Reset Flow) -->
    <path class="line-bus" d="M 260 486 L 260 540 L 290 540" />

    <!-- Letzter Admin gelöscht? -->
    <g transform="translate(290, 518)">
        <rect class="card" width="190" height="44" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
        <text class="node-text" x="95" y="27" text-anchor="middle" fill="#b45309">Letzter Admin gelöscht?</text>
    </g>

    <path class="line" d="M 480 540 L 520 540" />

    <!-- wyarf.irs gelöscht -->
    <g transform="translate(520, 518)">
        <rect class="card" width="160" height="44" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <text class="node-text" x="80" y="27" text-anchor="middle" fill="#b91c1c">🗑️ 'wyarf.irs' gelöscht</text>
    </g>

    <path class="line" d="M 680 540 L 720 540" />

    <!-- wyarf wieder frei -->
    <g transform="translate(720, 518)">
        <rect class="card" width="200" height="44" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
        <text class="node-text" x="100" y="27" text-anchor="middle" fill="#1d4ed8">🔓 <tspan class="code-text">/wyarf</tspan> wieder frei</text>
    </g>

    <!-- Rückführungsschleife nach oben zu /wyarf -->
    <path class="loop-line" d="M 920 540 L 960 540 L 960 134 L 240 134" />
    <rect x="910" y="325" width="90" height="24" rx="4" fill="#dbeafe"/>
    <text class="sub-text" x="955" y="341" text-anchor="middle" fill="#1e40af" font-weight="bold">Factory Reset</text>

</svg>