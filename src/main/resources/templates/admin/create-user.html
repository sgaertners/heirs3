<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benutzer anlegen - SGS HEIRS</title>

    <!-- WebJars: Bootstrap 5.3 & Icons -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">

    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }
        .main-content { flex: 1; }
        .card-custom {
            border: 1px solid #334155;
            background-color: #1e293b;
            border-radius: 0.75rem;
        }
        /* Kompakte Inputs und Labels */
        .form-label-sm {
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }
        .form-control-sm, .form-select-sm {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
            font-size: 0.85rem;
            padding: 0.4rem 0.65rem;
        }
        .form-control-sm:focus, .form-select-sm:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25) !important;
        }
    </style>
</head>
<body>

<!-- 1. NAVBAR EINBINDEN -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- 2. INHALT -->
<main class="main-content container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <!-- Zurück-Link -->
            <a th:href="@{/dashboard}" class="btn btn-link text-secondary text-decoration-none p-0 mb-3 small">
                <i class="bi bi-arrow-left me-1"></i>Zurück zur Admin-Zentrale
            </a>

            <div class="card card-custom shadow-lg p-3 p-md-4">

                <!-- Titelbereich -->
                <div class="d-flex align-items-center mb-3 pb-2 border-bottom border-secondary border-opacity-25">
                    <div class="p-2 bg-primary bg-opacity-25 text-primary rounded-3 me-2 fs-4">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <div>
                        <h5 class="card-title text-white mb-0 fw-bold">Neuen Benutzer anlegen</h5>
                        <small class="text-secondary" style="font-size: 0.78rem;">Erzeugt Ed25519-Ausweis & druckfertigen DIN-5008-Brief</small>
                    </div>
                </div>

                <!-- Fehlerbox -->
                <div th:if="${error}" class="alert alert-danger py-2 small d-flex align-items-center mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- Formular mit kompakten Feldern -->
                <form th:action="@{/admin/create-user}" method="post">

                    <!-- 1. Benutzername -->
                    <div class="mb-2">
                        <label for="username" class="form-label-sm">
                            <i class="bi bi-person-badge me-1 text-primary"></i>Benutzername / Kennung <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control form-control-sm" id="username" name="username"
                               placeholder="z. B. max_mustermann" required autofocus>
                    </div>

                    <!-- 2. Adress-Abschnitt für den DIN 5008 Brief -->
                    <div class="p-2 my-2 rounded bg-dark border border-secondary border-opacity-25">
                        <div class="text-info fw-semibold mb-2" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                            <i class="bi bi-geo-alt me-1"></i>EMPFÄNGERADRESSE (FÜR DIN 5008 BRIEF)
                        </div>

                        <!-- Name auf dem Brief -->
                        <div class="mb-2">
                            <label for="fullName" class="form-label-sm">Vollständiger Name / Anrede</label>
                            <input type="text" class="form-control form-control-sm" id="fullName" name="fullName"
                                   placeholder="z. B. Herr Max Mustermann">
                        </div>

                        <!-- Straße & Hausnummer -->
                        <div class="mb-2">
                            <label for="street" class="form-label-sm">Straße & Hausnummer</label>
                            <input type="text" class="form-control form-control-sm" id="street" name="street"
                                   placeholder="Musterstraße 12">
                        </div>

                        <!-- PLZ & Ort nebeneinander -->
                        <div class="row g-2">
                            <div class="col-4">
                                <label for="zipCode" class="form-label-sm">PLZ</label>
                                <input type="text" class="form-control form-control-sm" id="zipCode" name="zipCode"
                                       placeholder="12345">
                            </div>
                            <div class="col-8">
                                <label for="city" class="form-label-sm">Ort / Stadt</label>
                                <input type="text" class="form-control form-control-sm" id="city" name="city"
                                       placeholder="Musterstadt">
                            </div>
                        </div>
                    </div>

                    <!-- 3. Gültigkeitsdauer -->
                    <div class="mb-3">
                        <label for="validYears" class="form-label-sm">
                            <i class="bi bi-calendar-check me-1 text-primary"></i>Gültigkeit des Ausweises
                        </label>
                        <select class="form-select form-select-sm" id="validYears" name="validYears">
                            <option value="1" selected>1 Jahr (Standard)</option>
                            <option value="2">2 Jahre</option>
                            <option value="5">5 Jahre</option>
                        </select>
                    </div>

                    <!-- Checkbox: Direkt als Erblasser anlegen -->
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="erblasser" name="erblasser" value="true">
                        <label class="form-check-label text-white small" for="erblasser">
                            <i class="bi bi-bank me-1 text-primary"></i>Diesen Benutzer direkt als <strong>Erblasser</strong> kennzeichnen
                        </label>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="verwalter" name="verwalter" value="true">
                        <label class="form-check-label text-white small" for="verwalter">
                            <i class="bi bi-award me-1 text-warning"></i>Diesen Benutzer als <strong>Erbschaftsverwalter / Notar</strong> registrieren
                        </label>
                    </div>

                    <!-- Submit-Button -->
                    <button type="submit" class="btn btn-primary btn-sm w-100 py-2 shadow fw-semibold">
                        <i class="bi bi-file-earmark-pdf-fill me-1"></i>Ausweis & DIN 5008 Brief generieren
                    </button>
                </form>

            </div>

        </div>
    </div>
</main>

<footer class="py-3 text-center text-secondary small border-top border-secondary border-opacity-25">
    <div class="container">&copy; 2026 SGS HEIRS • Administratorbereich</div>
</footer>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>
</body>
</html>
