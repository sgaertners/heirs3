<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung - QR-Code & Admin</title>

    <!-- Bootstrap 5.3 CSS via WebJar -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons via WebJar -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">

    <!-- HTML5 QR-Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        #reader {
            width: 100%;
            border-radius: 0.375rem;
            overflow: hidden;
        }
        #reader video {
            object-fit: cover;
            border-radius: 0.375rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center g-4">
        <div class="col-12 col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-shield-lock me-2"></i>Login
                    </h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">
                        Zugang zur Ausstellung neuer digitaler Ausweise und PDF-Briefe.
                    </p>

                    <!-- Feedback-Meldungen Admin Login -->
                    <div th:if="${param.error != null and param.error != 'expired' and param.error != 'invalid_signature' and param.error != 'auth_failed'}"
                         class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-circle-fill flex-shrink-0 me-2"></i>
                        <div>Benutzername oder Passwort falsch!</div>
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill flex-shrink-0 me-2"></i>
                        <div>Erfolgreich abgemeldet.</div>
                    </div>

                    <!-- Login-Formular -->
                    <form th:action="@{/master}" method="post" class="mt-4">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="admin" required>
                            <label for="username"><i class="bi bi-person me-1"></i>Benutzername</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Passwort" required>
                            <label for="password"><i class="bi bi-key me-1"></i>Passwort</label>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Anmelden
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap 5.3 Bundle JS via WebJar -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>

<!-- QR-Scanner Logik -->
<script>
    const html5QrCode = new Html5Qrcode("reader");
    const errorBox = document.getElementById("jsError");
    const errorText = document.getElementById("jsErrorText");
    const startBtn = document.getElementById("startCamBtn");
    const readerDiv = document.getElementById("reader");

    function showError(msg) {
        errorText.innerText = msg;
        errorBox.style.display = "flex";
    }

    function onScanSuccess(decodedText) {
        html5QrCode.stop().then(() => {
            if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
                window.location.href = decodedText;
            } else {
                showError("Gescannter QR-Code enthält keinen gültigen Ausweis-Link.");
            }
        });
    }

    startBtn.addEventListener("click", () => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError("Browser blockiert Kamera: HTTPS oder Localhost erforderlich!");
            return;
        }

        startBtn.style.display = "none";
        readerDiv.style.display = "block";

        const config = { fps: 15, qrbox: { width: 250, height: 250 } };

        // Bevorzuge Smartphone-Rückkamera
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(() => {
                // Fallback für Laptops / Webcams
                html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
                    .catch(err => {
                        readerDiv.style.display = "none";
                        startBtn.style.display = "block";
                        showError("Kamerazugriff wurde verweigert.");
                    });
            });
    });
</script>

</body>
</html>
